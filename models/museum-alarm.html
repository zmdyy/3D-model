<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文物展台防盗报警装置 · 3D 重建</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#dce8f0;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
.toolbar,.info,.tip{position:fixed;z-index:10;background:rgba(255,255,255,.9);border:1px solid #d3deea;box-shadow:0 8px 26px rgba(35,57,83,.12);backdrop-filter:blur(10px)}
.toolbar{left:18px;top:18px;padding:11px 12px;border-radius:14px;display:flex;gap:8px}
.toolbar button{border:0;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer;background:#2f7de1;color:white}
.toolbar button.alt{background:#f2f6fb;color:#35516f;border:1px solid #cfdae7}
.info{right:18px;top:18px;width:310px;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.65;color:#40566e}
.info b{color:#1f3449}.ok{color:#11775a;font-weight:800}.alarm{color:#c53d31;font-weight:800}
.tip{left:18px;bottom:18px;padding:8px 11px;border-radius:10px;font-size:12px;color:#667b91}
</style>
</head>
<body>
<div class="toolbar">
<button id="safe">展品在位</button>
<button id="alarm">取走展品</button>
<button id="reset" class="alt">恢复视角</button>
</div>
<div class="info"><b>文物展台防盗报警装置 · 3D 重建版</b><br>当前状态：<span id="state" class="ok">展品在位，电铃不响</span><br>元件位置、外形和接线按确认图重建。</div>
<div class="tip">拖拽旋转 · Shift/右键拖拽平移 · 滚轮缩放</div>
<canvas id="c"></canvas>
<script src="../shared/vendor/three-r144.min.js"></script>
<script>
(function(){
'use strict';
if(THREE.ColorManagement) THREE.ColorManagement.legacyMode=false;
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xdce8f0);
const camera=new THREE.PerspectiveCamera(35,1,.1,100);

scene.add(new THREE.HemisphereLight(0xffffff,0xaec2d5,.92));
const key=new THREE.DirectionalLight(0xffffff,1.15);key.position.set(9,18,10);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);
const fill=new THREE.DirectionalLight(0xdbeaff,.35);fill.position.set(-10,8,-8);scene.add(fill);

function woodTex(){
 const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d');
 const g=x.createLinearGradient(0,0,512,256);g.addColorStop(0,'#ddb17a');g.addColorStop(.5,'#bf8148');g.addColorStop(1,'#d19a62');x.fillStyle=g;x.fillRect(0,0,512,256);
 x.strokeStyle='rgba(94,56,27,.24)';x.lineWidth=2;
 for(let i=0;i<24;i++){x.beginPath();const y=9+i*10;for(let px=0;px<=512;px+=8){const py=y+Math.sin(px*.04+i*.7)*2.2;if(px===0)x.moveTo(px,py);else x.lineTo(px,py)}x.stroke()}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1.8,1.2);t.encoding=THREE.sRGBEncoding;return t;
}
const M={
 board:new THREE.MeshStandardMaterial({color:0xd5dfeb,roughness:.72}),
 edge:new THREE.MeshStandardMaterial({color:0xb7c6d6,roughness:.76}),
 wood:new THREE.MeshStandardMaterial({color:0xc78a51,map:woodTex(),roughness:.64}),
 plate:new THREE.MeshStandardMaterial({color:0xc7ccd3,roughness:.23,metalness:.95}),
 steel:new THREE.MeshStandardMaterial({color:0xb8c2cf,roughness:.2,metalness:1}),
 dark:new THREE.MeshStandardMaterial({color:0x41464e,roughness:.3,metalness:.8}),
 brass:new THREE.MeshStandardMaterial({color:0xc7973f,roughness:.25,metalness:.92}),
 red:new THREE.MeshStandardMaterial({color:0xd92520,roughness:.4,metalness:.14}),
 black:new THREE.MeshStandardMaterial({color:0x2e3238,roughness:.55,metalness:.18}),
 blue:new THREE.MeshStandardMaterial({color:0x96acc6,roughness:.55}),
 wire:new THREE.MeshStandardMaterial({color:0xe12622,roughness:.36,metalness:.16}),
 bronze:new THREE.MeshStandardMaterial({color:0x91601f,roughness:.42,metalness:.88}),
 glass:new THREE.MeshPhysicalMaterial({color:0xf4fbff,roughness:.06,transparent:true,opacity:.34,transmission:.68,depthWrite:false})
};
function box(w,h,d,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.castShadow=true;o.receiveShadow=true;return o}
function cyl(r1,r2,h,m,n=32){const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,n),m);o.castShadow=true;o.receiveShadow=true;return o}
function sph(r,m){const o=new THREE.Mesh(new THREE.SphereGeometry(r,32,22),m);o.castShadow=true;return o}
function post(red=true){const g=new THREE.Group();let o=cyl(.15,.17,.10,M.brass,24);o.position.y=.05;g.add(o);o=cyl(.12,.12,.29,red?M.red:M.black,24);o.position.y=.24;g.add(o);o=cyl(.17,.17,.10,red?M.red:M.black,24);o.position.y=.44;g.add(o);return g}
function label(text,s=1){
 const c=document.createElement('canvas');c.width=320;c.height=96;const x=c.getContext('2d');
 x.fillStyle='rgba(249,250,252,.98)';x.strokeStyle='rgba(140,155,174,.75)';x.lineWidth=2;x.beginPath();x.roundRect(3,3,314,90,12);x.fill();x.stroke();
 x.fillStyle='#1c2d3d';x.font='700 34px Microsoft YaHei';x.textAlign='center';x.textBaseline='middle';x.fillText(text,160,49);
 const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));sp.scale.set(1.85*s,.56*s,1);sp.renderOrder=20;return sp
}
function wire(points,r=.078){const curve=new THREE.CatmullRomCurve3(points,false,'catmullrom',.06);const m=new THREE.Mesh(new THREE.TubeGeometry(curve,Math.max(48,points.length*18),r,10,false),M.wire);m.castShadow=true;return m}

const root=new THREE.Group();scene.add(root);
const board=box(21.4,.52,12.0,M.board);board.position.y=.26;root.add(board);
const edge=box(21.6,.18,12.2,M.edge);edge.position.y=.09;root.add(edge);

/* 文物台 */
const museum=new THREE.Group();museum.position.set(-7.15,.52,-2.55);root.add(museum);
const wood=box(5.55,1.36,3.18,M.wood);wood.position.y=.68;museum.add(wood);
const slot=box(2.05,.92,1.28,new THREE.MeshStandardMaterial({color:0x624027,roughness:.9}));slot.position.set(0,.88,0);museum.add(slot);
const A=box(.62,.12,1.95,M.plate);A.position.set(-2.02,1.43,0);museum.add(A);
const C=box(.62,.12,1.95,M.plate);C.position.set(2.02,1.43,0);museum.add(C);
const B=box(2.10,.12,1.08,M.plate);B.position.set(0,1.47,0);museum.add(B);
const pA=post(true);pA.position.set(-2.42,1.35,1.03);museum.add(pA);
const pC=post(true);pC.position.set(2.42,1.35,1.03);museum.add(pC);
const lA=label('A',.62);lA.position.set(-1.98,1.18,1.22);museum.add(lA);
const lB=label('B',.62);lB.position.set(.02,1.44,.92);museum.add(lB);
const lC=label('C',.62);lC.position.set(1.98,1.18,1.22);museum.add(lC);
const lS=label('弹簧',.82);lS.position.set(-.75,.84,1.35);museum.add(lS);
const pts=[];for(let i=0;i<=180;i++){const t=i/180,a=t*Math.PI*2*6;pts.push(new THREE.Vector3(Math.cos(a)*.24,t-.5,Math.sin(a)*.24))}
const spring=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),180,.05,10,false),M.dark);spring.position.set(0,1.02,0);spring.scale.y=.95;museum.add(spring);
let q=box(.12,.58,.12,M.dark);q.position.set(-.68,1.12,0);museum.add(q);q=box(.12,.58,.12,M.dark);q.position.set(.68,1.12,0);museum.add(q);

const vessel=new THREE.Group();vessel.position.set(0,1.62,0);museum.add(vessel);
const lp=[new THREE.Vector2(.38,0),new THREE.Vector2(.50,.05),new THREE.Vector2(.58,.22),new THREE.Vector2(.68,.52),new THREE.Vector2(.72,.82),new THREE.Vector2(.67,1.0),new THREE.Vector2(.55,1.08),new THREE.Vector2(.48,1.20)];
const vb=new THREE.Mesh(new THREE.LatheGeometry(lp,56),M.bronze);vb.castShadow=true;vessel.add(vb);
const rim=new THREE.Mesh(new THREE.TorusGeometry(.72,.06,12,48),M.brass);rim.rotation.x=Math.PI/2;rim.position.y=1.18;vessel.add(rim);
for(const s of [-1,1]){const e=new THREE.Mesh(new THREE.TorusGeometry(.18,.035,10,24,Math.PI),M.brass);e.rotation.z=Math.PI/2;e.position.set(.66*s,1.12,0);vessel.add(e)}
for(let i=0;i<3;i++){const a=i*Math.PI*2/3+Math.PI/6;const leg=cyl(.08,.06,.54,M.bronze,14);leg.position.set(Math.cos(a)*.38,-.20,Math.sin(a)*.16);vessel.add(leg)}

/* 刀开关 */
const sw=new THREE.Group();sw.position.set(6.45,.52,-3.28);root.add(sw);
const swBase=box(3.55,.38,1.0,M.blue);swBase.position.y=.19;sw.add(swBase);
const swL=post(true);swL.position.set(-1.25,.38,0);sw.add(swL);const swR=post(true);swR.position.set(1.25,.38,0);sw.add(swR);
q=box(.22,.78,.34,M.steel);q.position.set(-.95,.72,0);sw.add(q);q=box(.22,.60,.34,M.steel);q.position.set(.35,.63,0);sw.add(q);
const bladePivot=new THREE.Group();bladePivot.position.set(-.95,1.05,0);sw.add(bladePivot);
const blade=box(2.10,.16,.28,M.plate);blade.position.x=1.03;bladePivot.add(blade);
const handle=cyl(.18,.18,.72,new THREE.MeshStandardMaterial({color:0xa8c6e4,roughness:.32,metalness:.28}),22);handle.rotation.z=Math.PI/2;handle.position.set(2.20,.04,0);bladePivot.add(handle);
const collar=cyl(.15,.15,.18,M.steel,18);collar.rotation.z=Math.PI/2;collar.position.set(1.75,.04,0);bladePivot.add(collar);
const swLab=label('刀开关',.9);swLab.position.set(0,.47,.56);sw.add(swLab);

/* 电铃 */
const bell=new THREE.Group();bell.position.set(-.65,.52,-.10);root.add(bell);
const bellBase=box(2.30,.56,1.42,M.blue);bellBase.position.y=.28;bell.add(bellBase);
const bt=post(true);bt.position.set(-.72,.55,-.58);bell.add(bt);const bb=post(true);bb.position.set(-1.05,.55,.48);bell.add(bb);
q=box(.92,.38,.58,M.black);q.position.set(-.02,.42,0);bell.add(q);
const domeMat=new THREE.MeshStandardMaterial({color:0xdfe5ee,roughness:.10,metalness:1});
const bellDome=new THREE.Mesh(new THREE.SphereGeometry(1.05,44,28,0,Math.PI*2,0,Math.PI*.52),domeMat);bellDome.scale.y=.78;bellDome.position.set(0,1.28,0);bellDome.castShadow=true;bell.add(bellDome);
const cap=sph(.10,M.brass);cap.position.set(0,1.63,0);bell.add(cap);
const bellLab=label('电铃',.86);bellLab.position.set(0,.42,.78);bell.add(bellLab);

/* 灯泡 */
const lamp=new THREE.Group();lamp.position.set(1.75,.52,3.10);root.add(lamp);
const lampBase=box(2.60,.36,.95,M.blue);lampBase.position.y=.18;lamp.add(lampBase);
const lpL=post(true);lpL.position.set(-.88,.36,0);lamp.add(lpL);const lpR=post(true);lpR.position.set(.88,.36,0);lamp.add(lpR);
const holder=cyl(.36,.42,.72,new THREE.MeshStandardMaterial({color:0xb8c8d8,roughness:.4,metalness:.3}),32);holder.position.set(0,.56,0);lamp.add(holder);
const socket=cyl(.22,.27,.36,M.steel,30);socket.position.set(0,.98,0);lamp.add(socket);
const bulb=sph(.48,M.glass);bulb.scale.y=1.15;bulb.position.set(0,1.52,0);lamp.add(bulb);
const glow=sph(.18,new THREE.MeshBasicMaterial({color:0xffc84c}));glow.position.set(0,1.30,0);lamp.add(glow);
const lampLab=label('灯泡',.86);lampLab.position.set(0,.36,.68);lamp.add(lampLab);

/* 电源 */
const battery=new THREE.Group();battery.position.set(8.05,.52,2.55);root.add(battery);
const batBody=box(3.30,1.20,1.70,new THREE.MeshStandardMaterial({color:0x90a7c3,roughness:.52}));batBody.position.y=.60;battery.add(batBody);
const batTop=box(3.30,.18,1.70,new THREE.MeshStandardMaterial({color:0xb9c7d5,roughness:.55}));batTop.position.y=1.29;battery.add(batTop);
const neg=post(false);neg.position.set(-.85,1.12,-.50);battery.add(neg);const pos=post(true);pos.position.set(1.20,1.12,-.50);battery.add(pos);
const minus=label('−',.65);minus.position.set(-1.18,.66,.92);battery.add(minus);
const power=label('电源',.86);power.position.set(0,.66,.92);battery.add(power);
const plus=label('+',.65);plus.position.set(1.15,.66,.92);battery.add(plus);

/* 导线：严格按确认图 */
const wy=.98;
const P={
 A:new THREE.Vector3(-9.57,wy,-1.52), corner:new THREE.Vector3(-9.57,wy,3.65), bottom:new THREE.Vector3(-3.45,wy,3.65),
 lampL:new THREE.Vector3(.87,wy,3.65), lampR:new THREE.Vector3(2.63,wy,3.65),
 batN:new THREE.Vector3(7.20,wy,3.45), batP:new THREE.Vector3(9.25,wy,3.45),
 swR:new THREE.Vector3(7.70,wy,-3.25), swL:new THREE.Vector3(5.20,wy,-3.25),
 top:new THREE.Vector3(-1.10,wy,-2.50), C:new THREE.Vector3(-4.73,wy,-2.50),
 bellT:new THREE.Vector3(-1.37,wy,-.67), bellB:new THREE.Vector3(-1.70,wy,.45)
};
const wires=new THREE.Group();root.add(wires);
wires.add(wire([P.A,P.corner,P.bottom]));
wires.add(wire([P.bottom,new THREE.Vector3(-1.95,wy,3.65),P.lampL]));
wires.add(wire([P.lampR,new THREE.Vector3(5.55,wy,3.65),new THREE.Vector3(5.55,wy,3.45),P.batN]));
wires.add(wire([P.batP,new THREE.Vector3(9.90,wy,3.45),new THREE.Vector3(9.90,wy,-3.25),P.swR]));
wires.add(wire([P.swL,new THREE.Vector3(4.45,wy,-3.25),new THREE.Vector3(4.45,wy,-2.50),P.top,P.C]));
wires.add(wire([P.top,new THREE.Vector3(-1.10,wy,-.82),P.bellT]));
wires.add(wire([P.bellB,new THREE.Vector3(-1.70,wy,2.70),new THREE.Vector3(-2.45,wy,3.65),P.bottom]));
function joint(v){const j=sph(.12,M.red);j.position.copy(v);root.add(j)}joint(P.top);joint(P.bottom);

/* 状态 */
let alarm=false;
const st=document.getElementById('state');
function setAlarm(v){
 alarm=v;
 B.position.y=v?1.78:1.47;
 spring.scale.y=v?1.22:.95;
 spring.position.y=v?1.12:1.02;
 vessel.position.y=v?1.93:1.62;
 st.textContent=v?'展品被取走，电铃报警':'展品在位，电铃不响';
 st.className=v?'alarm':'ok';
 glow.scale.setScalar(v?.80:1.00);
}
document.getElementById('safe').onclick=()=>setAlarm(false);
document.getElementById('alarm').onclick=()=>setAlarm(true);

/* 相机控制：与油量测量装置一致 */
const view={theta:.50,phi:1.03,dist:24.3,distTarget:24.3,target:new THREE.Vector3(-.2,2.55,.35)};
const DEF={theta:.50,phi:1.03,dist:24.3,target:[-.2,2.55,.35]};
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function applyCamera(){const sp=Math.sin(view.phi),cp=Math.cos(view.phi);camera.position.set(view.target.x+view.dist*sp*Math.sin(view.theta),view.target.y+view.dist*cp,view.target.z+view.dist*sp*Math.cos(view.theta));camera.lookAt(view.target)}
let drag=null;
canvas.oncontextmenu=e=>e.preventDefault();
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,theta:view.theta,phi:view.phi,tx:view.target.x,ty:view.target.y,tz:view.target.z,pan:e.shiftKey||e.button===2};canvas.style.cursor='grabbing'});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.pan){view.theta=drag.theta-dx*.0065;view.phi=clamp(drag.phi-dy*.0055,.20,Math.PI/2-.02)}else{const s=view.dist*.00155;view.target.x=drag.tx-dx*Math.cos(view.theta)*s;view.target.z=drag.tz+dx*Math.sin(view.theta)*s;view.target.y=drag.ty+dy*s*.62}});
function end(){drag=null;canvas.style.cursor='grab'}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
canvas.addEventListener('wheel',e=>{e.preventDefault();view.distTarget=clamp(view.distTarget*(1+Math.sign(e.deltaY)*.08),10,38)},{passive:false});
document.getElementById('reset').onclick=()=>{view.theta=DEF.theta;view.phi=DEF.phi;view.distTarget=DEF.dist;view.target.set(...DEF.target)};
canvas.style.cursor='grab';

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();

let t=0,last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
 if(alarm){bellDome.rotation.z=Math.sin(t*22)*.015}else bellDome.rotation.z*=.85;
 view.dist+=(view.distTarget-view.dist)*.14;applyCamera();renderer.render(scene,camera);requestAnimationFrame(loop)
}
setAlarm(false);requestAnimationFrame(loop);
})();
</script>
</body>
</html>
